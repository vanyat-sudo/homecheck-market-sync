name: HomeCheck daily market sync

on:
  schedule:
    # 6am Brisbane is 20:00 UTC on the previous day, year-round.
    # Off-hour catch-ups at 6:17, 6:47 ... 9:47am tolerate a missed start.
    # GitHub can delay starts; the API deduplicates completed daily runs.
    - cron: "0 20 * * *"
    - cron: "17,47 20-23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: homecheck-market-tracker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Show non-secret repository identity
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          echo "Repository: $REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "Repository ID: $REPOSITORY_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Check out scheduler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          persist-credentials: false
      - name: Run scheduled market sync
        env:
          HOMECHECK_URL: ${{ vars.HOMECHECK_URL }}
        run: node scripts/run-market-scheduler.mjs
