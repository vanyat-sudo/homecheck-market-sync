name: HomeCheck daily market sync

on:
  schedule:
    # Brisbane is UTC+10 year-round. GitHub may delay scheduled starts.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: homecheck-market-tracker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Show non-secret repository identity
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          echo "Repository: $REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "Repository ID: $REPOSITORY_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Check out scheduler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          persist-credentials: false
      - name: Run scheduled market sync
        env:
          HOMECHECK_URL: ${{ vars.HOMECHECK_URL }}
        run: node scripts/run-market-scheduler.mjs
